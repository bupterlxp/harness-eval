<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - HR管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.15);padding:40px;width:400px}
.login-box h1{text-align:center;color:#333;font-size:22px;margin-bottom:8px}
.login-box .subtitle{text-align:center;color:#999;font-size:13px;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:6px;font-weight:500;color:#333;font-size:14px}
.form-group input{width:100%;padding:10px 14px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
.login-btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.error-msg{color:#ff4d4f;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.accounts-hint{margin-top:24px;padding-top:16px;border-top:1px solid #f0f0f0;font-size:12px;color:#999;text-align:center;line-height:1.8}
.cookie-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;color:#fff;padding:16px 24px;z-index:300;justify-content:space-between;align-items:center}
.cookie-banner.active{display:flex}
.cookie-banner p{font-size:13px;color:rgba(255,255,255,.85);margin-right:16px;flex:1}
.cookie-banner button{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;border:none;margin-left:8px}
.cookie-banner .accept{background:#667eea;color:#fff}
.cookie-banner .decline{background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="login-box">
  <h1>🏢 HR管理系统</h1>
  <p class="subtitle">企业人事管理平台</p>
  <form id="login-form" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="login-btn">登 录</button>
    <div class="error-msg" id="error-msg"></div>
  </form>
  <div class="accounts-hint">
    测试账号：admin / admin123（管理员）<br>
    user01 / user123（普通员工）
  </div>
</div>

<div class="cookie-banner" id="cookie-banner">
  <p>本系统使用 Cookie 来保障您的登录状态和使用体验。继续使用即表示您同意我们的 Cookie 政策。</p>
  <div>
    <button class="decline" onclick="handleCookie('declined')">拒绝非必要</button>
    <button class="accept" onclick="handleCookie('accepted')">接受所有 Cookie</button>
  </div>
</div>

<script>
(function(){
  if(!localStorage.getItem('cookie_consent')){
    setTimeout(function(){document.getElementById('cookie-banner').classList.add('active')},600);
  }
})();
function handleCookie(v){localStorage.setItem('cookie_consent',v);document.getElementById('cookie-banner').classList.remove('active')}

function handleLogin(e){
  e.preventDefault();
  var btn=document.getElementById('login-btn');
  var err=document.getElementById('error-msg');
  btn.disabled=true;btn.textContent='登录中...';err.textContent='';
  var u=document.getElementById('username').value;
  var p=document.getElementById('password').value;
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})})
  .then(function(res){
    if(res.ok){window.location.href='/dashboard'}
    else{err.textContent=res.data.error||'登录失败';btn.disabled=false;btn.textContent='登 录'}
  })
  .catch(function(){err.textContent='网络错误，请重试';btn.disabled=false;btn.textContent='登 录'});
  return false;
}
</script>
</body>
</html>
