benchmarks:
  - id: swebench_pro
    name: SWE-bench pro
    domain: code
    runner: swebench_generated
    required_paths:
      - harness_house/benchmarks/benchmarks/swebench/run_infer.py
      - harness_house/benchmarks/benchmarks/swebench/eval_infer.py
    required_executables:
      - uv
      - docker
    dataset: princeton-nlp/SWE-bench_Verified
    split: test
    workspace: docker
    n_limit: 1
    threads: 1
    eval_workers: 1
    modal: false
    default_subset: "1 instance"

  - id: terminal_2_bench
    name: Terminal 2.0 bench
    domain: code
    runner: terminalbench_generated
    required_paths:
      - harness_house/benchmarks/benchmarks/terminalbench/run_infer.py
      - harness_house/benchmarks/benchmarks/terminalbench/eval_infer.py
    required_executables:
      - uv
      - docker
    dataset: terminal-bench@2.0
    n_limit: 1
    threads: 1
    task_work_dir: /app
    default_subset: "1 task"

  - id: mle_bench
    name: MLE-bench
    domain: data_analysis
    runner: mlebench_generated
    required_paths:
      - $HARNESS_EVAL_ROOT/external_benchmarks/mle-bench/run_agent.py
      - $HARNESS_EVAL_ROOT/external_benchmarks/mle-bench/mlebench/cli.py
    competition_id: spaceship-titanic
    n_limit: 1
    default_subset: "1 prepared Kaggle competition"

  - id: dacomp
    name: DAComp
    domain: data_analysis
    runner: dacomp_generated
    required_paths:
      - harness_house/DAComp/dacomp-da/tasks/dacomp-da.jsonl
      - harness_house/DAComp/dacomp-da/evaluation_suite/llm_judge.py
      - harness_house/DAComp/dacomp-da/evaluation_suite/get_score.py
    required_env_any:
      - [SEED2LITE_API_KEY, API_KEY]
    task_ids: [dacomp-001]
    threads: 1
    default_subset: "dacomp-001"

  - id: writing_bench
    name: Writing-bench
    domain: writing
    runner: writingbench_generated
    required_paths:
      - $HARNESS_EVAL_ROOT/external_benchmarks/WritingBench/benchmark_query/benchmark_all.jsonl
      - $HARNESS_EVAL_ROOT/external_benchmarks/WritingBench/prompt.py
    required_env_any:
      - [WRITINGBENCH_JUDGE_API_KEY, SEED2LITE_API_KEY, API_KEY]
    lang: en
    n_limit: 1
    criteria_limit: 5
    default_subset: "1 prompt"

  - id: eqbench3
    name: EQbench3
    domain: writing
    runner: eqbench3
    required_paths:
      - writing_harness_eval/scripts/run_eqbench_kimi_smoke.sh
      - writing_harness_eval/scripts/summarize_eqbench_run.py
      - writing_harness_eval/third_party/eqbench3/eqbench3.py
    required_env_any:
      - [SEED2LITE_API_KEY, API_KEY]
    default_subset: "1"
    threads: 1

  - id: deepresearch_bench
    name: Deepresearch bench
    domain: research
    runner: deepresearch_generated
    required_paths:
      - harness_house/DeepResearch/DeepResearch/eval_data/hle_test.jsonl
    required_env_any:
      - [DEEPRESEARCH_JUDGE_API_KEY, SEED2LITE_API_KEY, API_KEY]
    search_provider: "SERPER_KEY_ID/TAVILY_API_KEY/SEARCH_API_KEY preferred; Bing/DuckDuckGo HTML fallback for local one-task bring-up"
    max_search_queries: 2
    n_limit: 1
    default_subset: "1 text-only HLE-style task"

  - id: browsecomp
    name: browseComp
    domain: research
    runner: browsecomp_generated
    required_paths:
      - $HARNESS_EVAL_ROOT/external_benchmarks/simple-evals/browsecomp_eval.py
    required_env_any:
      - [BROWSECOMP_JUDGE_API_KEY, SEED2LITE_API_KEY, API_KEY]
    search_provider: "SERPER_KEY_ID/TAVILY_API_KEY/SEARCH_API_KEY preferred; Bing/DuckDuckGo HTML fallback for local one-task bring-up"
    max_search_queries: 2
    n_limit: 1
    default_subset: "1 question"

  - id: the_agent_company
    name: TheAgentCompany
    domain: browser
    runner: unsupported
    required_paths:
      - harness_house/benchmarks/legacy/the_agent_company/run_infer.py
    required_executables:
      - docker
    unsupported_reason: "TheAgentCompany runner expects OpenHands agent config plus service stack; generated browser harness needs an OpenHands/browser-agent adapter."
    default_subset: "1 task image"
