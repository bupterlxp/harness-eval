{% extends "base.html" %}
{% block title %}员工详情 - HR管理系统{% endblock %}
{% block content %}
<div style="margin-bottom:16px"><a href="/employees">← 返回员工列表</a></div>
<div class="card" id="emp-info"><div class="loading">加载中...</div></div>
<div class="card" id="leave-history"><div class="loading">加载中...</div></div>
{% endblock %}
{% block scripts %}
<script>
var eid={{employee_id}};
fetch('/api/employees/'+eid).then(r=>{if(!r.ok)throw new Error('not found');return r.json()}).then(function(d){
  var e=d.employee;
  var badge=e.status==='active'?'badge-active':'badge-inactive';
  var statusText=e.status==='active'?'在职':'离职';
  document.getElementById('emp-info').innerHTML=
    '<h2>员工信息</h2>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 40px">'+
    '<div><strong>姓名：</strong>'+e.name+'</div>'+
    '<div><strong>工号：</strong>EMP'+String(e.id).padStart(3,'0')+'</div>'+
    '<div><strong>性别：</strong>'+e.gender+'</div>'+
    '<div><strong>部门：</strong>'+e.department_name+'</div>'+
    '<div><strong>职位：</strong>'+e.position+'</div>'+
    '<div><strong>状态：</strong><span class="badge '+badge+'">'+statusText+'</span></div>'+
    '<div><strong>邮箱：</strong>'+e.email+'</div>'+
    '<div><strong>电话：</strong>'+e.phone+'</div>'+
    '<div><strong>入职日期：</strong>'+e.hire_date+'</div>'+
    '<div><strong>年假余额：</strong><span style="color:#1890ff;font-weight:600">'+e.annual_leave_balance+' 天</span></div>'+
    '<div><strong>绩效评分：</strong><span style="color:'+(e.performance_score>=80?'#52c41a':'#d48806')+';font-weight:600">'+e.performance_score+'</span></div>'+
    '</div>';
  var html='<h2>请假记录</h2>';
  if(d.leave_history.length===0){html+='<p style="color:#999;padding:12px 0">暂无请假记录</p>'}
  else{
    html+='<table><thead><tr><th>类型</th><th>开始日期</th><th>结束日期</th><th>原因</th><th>状态</th><th>审批时间</th></tr></thead><tbody>';
    d.leave_history.forEach(function(l){
      var cls=l.status==='pending'?'badge-pending':l.status==='approved'?'badge-approved':'badge-rejected';
      var st=l.status==='pending'?'待审批':l.status==='approved'?'已批准':'已拒绝';
      html+='<tr><td>'+l.leave_type+'</td><td>'+l.start_date+'</td><td>'+l.end_date+'</td><td>'+l.reason+'</td><td><span class="badge '+cls+'">'+st+'</span></td><td>'+(l.reviewed_at||'-')+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  document.getElementById('leave-history').innerHTML=html;
}).catch(function(){document.getElementById('emp-info').innerHTML='<div class="alert alert-error">员工不存在</div>'});
</script>
{% endblock %}
