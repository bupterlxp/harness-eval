{% extends "base.html" %}
{% block title %}请假管理 - HR管理系统{% endblock %}
{% block content %}
<div class="card">
  <h2>请假管理</h2>
  <div class="search-bar">
    <select id="status-filter">
      <option value="">全部状态</option>
      <option value="pending" selected>待审批</option>
      <option value="approved">已批准</option>
      <option value="rejected">已拒绝</option>
    </select>
    <button class="btn btn-primary" onclick="loadLeaves()">筛选</button>
    <a href="/leave/new" class="btn btn-success" style="margin-left:auto">+ 提交请假申请</a>
  </div>
  <div id="leave-table"><div class="loading">加载中...</div></div>
</div>

<!-- Reject modal -->
<div class="modal-overlay" id="reject-modal">
  <div class="modal">
    <h3>拒绝请假申请</h3>
    <div class="form-group">
      <label for="reject-comment">拒绝理由</label>
      <textarea id="reject-comment" rows="3" placeholder="请填写拒绝理由..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRejectModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmReject()">确认拒绝</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
var rejectingId=null;
function loadLeaves(){
  var status=document.getElementById('status-filter').value;
  var url='/api/leave-requests';
  if(status)url+='?status='+status;
  document.getElementById('leave-table').innerHTML='<div class="loading">加载中...</div>';
  fetch(url).then(r=>r.json()).then(function(d){
    if(d.leave_requests.length===0){document.getElementById('leave-table').innerHTML='<div class="loading">暂无记录</div>';return}
    var isAdmin='{{role}}'==='admin';
    var html='<table><thead><tr><th>ID</th><th>申请人</th><th>部门</th><th>类型</th><th>开始日期</th><th>结束日期</th><th>原因</th><th>状态</th>'+(isAdmin?'<th>操作</th>':'')+'</tr></thead><tbody>';
    d.leave_requests.forEach(function(l){
      var cls=l.status==='pending'?'badge-pending':l.status==='approved'?'badge-approved':'badge-rejected';
      var st=l.status==='pending'?'待审批':l.status==='approved'?'已批准':'已拒绝';
      html+='<tr><td>'+l.id+'</td><td>'+l.employee_name+'</td><td>'+l.department_name+'</td><td>'+l.leave_type+'</td><td>'+l.start_date+'</td><td>'+l.end_date+'</td><td>'+l.reason+'</td><td><span class="badge '+cls+'">'+st+'</span></td>';
      if(isAdmin){
        if(l.status==='pending'){
          html+='<td><button class="btn btn-success btn-sm" onclick="approveLeave('+l.id+')">通过</button> <button class="btn btn-danger btn-sm" onclick="openRejectModal('+l.id+')">拒绝</button></td>';
        }else{
          html+='<td><span style="color:#999">已处理</span></td>';
        }
      }
      html+='</tr>';
    });
    html+='</tbody></table>';
    document.getElementById('leave-table').innerHTML=html;
  });
}
function approveLeave(id){
  fetch('/api/leave-requests/'+id+'/approve',{method:'POST'}).then(r=>r.json()).then(function(d){
    if(d.message){showAlert('请假申请 #'+id+' 已批准','success');loadLeaves()}
    else{showAlert(d.error||'操作失败','error')}
  });
}
function openRejectModal(id){rejectingId=id;document.getElementById('reject-comment').value='';document.getElementById('reject-modal').classList.add('active')}
function closeRejectModal(){rejectingId=null;document.getElementById('reject-modal').classList.remove('active')}
function confirmReject(){
  var comment=document.getElementById('reject-comment').value;
  fetch('/api/leave-requests/'+rejectingId+'/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment:comment})})
  .then(r=>r.json()).then(function(d){
    closeRejectModal();
    if(d.message){showAlert('请假申请 #'+rejectingId+' 已拒绝','success');loadLeaves()}
    else{showAlert(d.error||'操作失败','error')}
  });
}
loadLeaves();
</script>
{% endblock %}
